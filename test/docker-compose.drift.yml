## Deterministic drift baseline through the real Sendspin -> bridge -> DANTE path.

volumes:
  shared:

networks:
  audio_net:
    driver: bridge

services:
  init:
    image: alpine:3
    command: sh -c "rm -rf /shared/* && echo 'shared volume cleared'"
    volumes:
      - shared:/shared

  ptp-master:
    build:
      context: ../statime
    cap_add:
      - SYS_TIME
    environment:
      STATIME_CONFIG: /etc/statime-ptpv2-master.toml
    volumes:
      - shared:/shared
      - ../statime/statime-ptpv2-master.toml:/etc/statime-ptpv2-master.toml:ro
    networks:
      - audio_net
    depends_on:
      init:
        condition: service_completed_successfully

  ptp-follower:
    build:
      context: ../statime
    cap_add:
      - SYS_TIME
    environment:
      STATIME_CONFIG: /etc/statime-ptpv2-follower.toml
    volumes:
      - shared:/shared
      - ../statime/statime-ptpv2-follower.toml:/etc/statime-ptpv2-follower.toml:ro
    networks:
      - audio_net
    depends_on:
      ptp-master:
        condition: service_started

  test_server:
    build:
      context: ./drift
      dockerfile: Dockerfile.server
    environment:
      DRIFT_PPM: "-250"
      AUDIO_DURATION_SECONDS: "90"
    volumes:
      - shared:/shared
    networks:
      - audio_net
    depends_on:
      init:
        condition: service_completed_successfully

  bridge:
    build:
      context: ..
      dockerfile: Dockerfile
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /shared/tmp_bridge && spin2dante --url ws://test_server:8927/sendspin --name SSDrift --buffer-ms 5 --server-buffer-ms 2000 --drift-threshold-ms 1 --drift-check-interval-ms 250 --max-correction-samples-per-tick 12 2>&1 | tee /shared/bridge.log"]
    environment:
      INFERNO_CLOCK_PATH: /shared/usrvclock
      INFERNO_TX_CHANNELS: "2"
      INFERNO_RX_CHANNELS: "0"
      TMPDIR: /shared/tmp_bridge
      RUST_LOG: "info"
    volumes:
      - shared:/shared
    networks:
      - audio_net
    ulimits:
      memlock: 200000000
    shm_size: 200m
    depends_on:
      ptp-follower:
        condition: service_started
      test_server:
        condition: service_started

  i2pipe:
    image: inferno_aoip:alpine-i2pipe
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /shared/tmp_i2pipe && sleep 15 && inferno2pipe -c 2 -o /shared/capture.raw"]
    environment:
      INFERNO_CLOCK_PATH: /shared/usrvclock
      INFERNO_NAME: i2pipe
      INFERNO_SAMPLE_RATE: "48000"
      INFERNO_RX_CHANNELS: "2"
      INFERNO_TX_CHANNELS: "0"
      TMPDIR: /shared/tmp_i2pipe
    volumes:
      - shared:/shared
    networks:
      - audio_net
    ulimits:
      memlock: 200000000
    shm_size: 200m
    depends_on:
      ptp-follower:
        condition: service_started
      bridge:
        condition: service_started

  validator:
    build:
      context: .
      dockerfile: drift/Dockerfile.validator
    volumes:
      - shared:/shared
    networks:
      - audio_net
    depends_on:
      bridge:
        condition: service_started
      i2pipe:
        condition: service_started
