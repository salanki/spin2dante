configuration:
  clock_path:
    name: Clock socket path
    description: Path to the usrvclock socket provided by the PTP daemon.
  wait_for_clock_seconds:
    name: Clock wait timeout
    description: How long to wait for the clock socket before startup fails.
  log_level:
    name: Log level
    description: Verbosity of add-on logs.
  dante_bind:
    name: DANTE bind
    description: >-
      Interface name or IPv4 address to use for DANTE/mDNS traffic. Set to
      auto to let Inferno choose the host's default local IPv4 address.
  drift_threshold_ms:
    name: Drift threshold
    description: Drift in milliseconds before the bridge applies an in-place anchor correction.
  drift_check_interval_ms:
    name: Drift check interval
    description: How often, in milliseconds, the bridge samples drift between the Sendspin and PTP timelines.
  max_correction_samples_per_tick:
    name: Max correction per tick
    description: Maximum anchor shift, in samples, that can be applied in one drift-correction tick.
  bridges:
    name: Bridges
    description: List of Sendspin-to-DANTE bridge definitions.
  dante_latency:
    name: DANTE latency
    description: >-
      Transmit latency advertised to DANTE receivers (ms). Lower values
      reduce end-to-end audio delay but need a reliable low-jitter network.
      Standard values: 0.5, 1, 2, 5, 10, 20. Default: 10.
  volume_control:
    name: Volume control
    description: >-
      "none" (default) for transparent passthrough, or "bridge" to enable
      software volume/mute control from Music Assistant.
  report_dante_subscriber:
    name: Report DANTE subscriber
    description: >-
      When enabled, the bridge reports ExternalSource to Music Assistant while
      no DANTE receiver is subscribed, causing the player to leave its group.
      Once a receiver subscribes, it reports Synchronized so the player can
      rejoin.
