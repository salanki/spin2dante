name: "spin2dante"
version: "sha-558febf"
slug: spin2dante
description: >-
  Bit-perfect bridge of one or more Sendspin audio streams to Audinate DANTE channels.
url: "https://github.com/salanki/spin2dante"
stage: experimental
startup: application
boot: auto
init: false
host_network: true
realtime: true
arch:
  - aarch64
  - amd64
image: ghcr.io/salanki/spin2dante-addon
map:
  - type: share
    read_only: false
    path: /share
privileged:
  - IPC_LOCK
ulimits:
  memlock:
    soft: 200000000
    hard: 200000000
  rtprio:
    soft: 99
    hard: 99
options:
  clock_path: "/share/usrvclock"
  wait_for_clock_seconds: 30
  log_level: "info"
  dante_bind: "auto"
  server_buffer_ms: 500
  drift_threshold_ms: 5
  drift_check_interval_ms: 1000
  max_correction_samples_per_tick: 48
  sync_log_interval_seconds: 120
  bridges:
    - id: kitchen
      name: Kitchen
      url: "ws://127.0.0.1:8927/sendspin"
      buffer_ms: 5
      dante_latency: 10
      volume_control: "none"
      process_id: 1
      alt_port: 14000
    - id: livingroom
      name: "Living Room"
      url: "ws://127.0.0.1:8927/sendspin"
      buffer_ms: 5
      dante_latency: 10
      volume_control: "none"
      process_id: 2
      alt_port: 14010
schema:
  clock_path: str
  wait_for_clock_seconds: int(0,300)
  log_level: list(trace|debug|info|warn|error)
  dante_bind: str
  server_buffer_ms: int(50,20000)
  drift_threshold_ms: int(0,250)
  drift_check_interval_ms: int(100,10000)
  max_correction_samples_per_tick: int(0,120)
  sync_log_interval_seconds: int(5,3600)
  bridges:
    - id: match(^[a-z0-9][a-z0-9_-]*$)
      name: str
      url: str
      buffer_ms: int(1,5000)
      server_buffer_ms: "int(50,20000)?"
      dante_latency: "list(0.5|1|2|5|10|20)?"
      volume_control: list(none|bridge)?
      process_id: int(1,65535)
      alt_port: int(1024,65532)
      report_dante_subscriber: bool?
